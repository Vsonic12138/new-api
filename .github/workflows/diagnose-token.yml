name: Diagnose token

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sync tokens
        env:
          SYNC: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          for name in SYNC UPSTREAM PAT; do
            val="${!name}"
            echo "$name len=${#val} prefix=${val:0:4}"
            if [[ -n "$val" ]]; then
              echo "$name user_code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $val" https://api.github.com/user)"
              echo "$name scopes: $(curl -s -I -H "Authorization: Bearer $val" https://api.github.com/rate_limit | grep -i '^x-oauth-scopes:' | tr -d '\r')"
            fi
          done
