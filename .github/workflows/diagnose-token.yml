name: Diagnose token

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect UPSTREAM_SYNC_TOKEN
        env:
          TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -x
          echo "prefix=${TOKEN:0:4}"          # ghp_=classic PAT, github_pat_=fine-grained, gho_=OAuth
          # classic PAT: GET /user returns the account; fine-grained PAT: returns 404
          echo "user: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/user)"
          # check scopes header (classic PAT only)
          echo "scopes: $(curl -s -I -H "Authorization: Bearer $TOKEN" https://api.github.com/rate_limit | grep -i '^x-oauth-scopes:' | tr -d '\r')"
