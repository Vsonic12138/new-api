name: Sync upstream

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Rebase main onto upstream
        run: |
          set -euo pipefail
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git checkout -B main origin/main
          git remote add upstream https://github.com/QuantumNous/new-api.git
          EXPECTED=$(git ls-remote origin refs/heads/main | cut -f1)
          git fetch upstream main
          git rebase upstream/main
          git merge-base --is-ancestor upstream/main main
          git push origin main --force-with-lease=refs/heads/main:$EXPECTED
