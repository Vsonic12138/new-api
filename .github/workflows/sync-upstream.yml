name: Sync upstream

on:
  schedule:
    # Every 6 hours (UTC). Mirrors QuantumNous/new-api main onto official-main.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GITHUB_TOKEN 无法推送 .github/workflows/ 变更（GitHub 安全限制），
          # 必须用带 workflow 权限的 PAT。UPSTREAM_SYNC_TOKEN 已配置。
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.SYNC_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main --prune

      - name: Mirror official-main to upstream/main
        run: |
          git branch -f official-main upstream/main
          git push origin official-main:official-main

      - name: Merge upstream into main
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git checkout main
          git merge --ff-only upstream/main \
            || git merge upstream/main -m "chore: merge upstream main"
          git push origin main

      - name: Report synced revisions
        run: |
          git fetch origin
          echo "upstream/main        = $(git rev-parse --short upstream/main)"
          echo "origin/official-main = $(git rev-parse --short origin/official-main)"
          echo "origin/main          = $(git rev-parse --short origin/main)"
